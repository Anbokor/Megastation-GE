version: '3.8'

services:
  megastation:
    build:
      context: .
      dockerfile: Dockerfile
    image: megastation:latest
    container_name: megastation-app
    restart: unless-stopped
    ports:
      - "5000:5000"
    environment:
      - NODE_ENV=production
      - PORT=5000
      - JWT_SECRET=megastation_jwt_secret_production_replace_with_secure_random
      - MERCADOPAGO_ACCESS_TOKEN=TEST-00000000-0000-0000-0000-000000000000
      - FRONTEND_URL=http://localhost:5000
    volumes:
      - ./data:/app/data
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:5000/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
